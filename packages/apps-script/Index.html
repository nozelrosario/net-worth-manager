.",formula:"Drift = Current Asset % - Target Asset %",interpretation:"Positive (+%): Overweight. Negative (-%): Underweight (defensively starved).",actionablePlaybook:"Negative drift points out where your portfolio is under-allocated. Direct fresh savings toward negative drift categories to buy assets at relatively lower valuations."},{id:"cash-drag",category:"core",name:"Cash Drag (₹ and %)",tag:"Opportunity Cost",tagVariant:"rose",keywords:"cash drag idle cash inflation penalty liquid interest yield",summary:"The invisible annual wealth penalty caused by keeping excess idle cash sitting in low-yield savings accounts instead of inflation-beating assets.",formula:"Cash Drag = (Excess Cash above 6M Buffer) × (Expected Portfolio Return - 3.0%)",interpretation:"Holding ₹10 Lakhs idle beyond emergency needs creates an invisible drag of ₹70,000 to ₹90,000 every single year against inflation.",actionablePlaybook:"Retain 6 to 12 months in an emergency liquid fund. Move remaining idle balances into Target Maturity Funds (TMFs) locking in ~7.4% sovereign yields or Arbitrage Funds."},{id:"emergency-runway",category:"core",name:"Emergency Runway (Months)",tag:"Defense Buffer",tagVariant:"emerald",keywords:"emergency runway months liquid buffer survival living expenses",summary:"The number of months your household can sustain current living expenses with zero income, relying strictly on immediate liquid cash and deposits.",formula:"Runway = Liquid Bank & Cash Balances ÷ Average Monthly Spends",interpretation:"Salaried: 6 to 9 Months. Self-employed / Business: 12 to 18 Months. Below 3 Months: High vulnerability.",actionablePlaybook:"If your runway is below 6 months, pause discretionary equity lump sums until your liquid emergency buffer is restored."},{id:"macro-regime",category:"macro",name:"Composite Macro Regime Score",tag:"0 – 100 Gauge",tagVariant:"sky",keywords:"macro regime weather score risk on risk off stagflation gauge",summary:"A multi-factor health score synthesizing global liquidity, interest rates, currency volatility, and domestic market momentum into 4 regimes.",formula:"Synthesized from TNX, USD/INR, India VIX, Nifty 200 EMA, Silver/Gold & Brent Crude.",interpretation:"Risk-On (70–100): Bullish equity expansion. Neutral (40–69): Steady-state. Risk-Off (<40): Stress/panic, prioritize safety. Stagflation Alert: High crude + rising yields.",actionablePlaybook:"Check the Macro Weather Bar before deploying lump sums. In Risk-Off regimes, do not panic sell; direct new monthly tranches into defensive yields and gold."},{id:"us-10y-yield",category:"macro",name:"US 10Y Treasury Yield (TNX)",tag:"Global Hurdle Rate",tagVariant:"amber",keywords:"us 10y tnx yield treasury bond fii outflow dollar hurdle",summary:"The interest rate paid by the US Government on 10-year debt. It serves as the baseline hurdle rate for global financial institutions.",formula:"Real-time ticker INDEXCBOE:TNX streaming via Google Finance.",interpretation:"When US yields rise above 4.30%–4.50%, foreign institutional investors (FIIs) pull capital from emerging markets (India) to earn guaranteed dollar yields.",actionablePlaybook:"Surging US yields create foreign selling pressure on Indian large-caps. Use these temporary FII pullbacks to buy high-quality index funds at attractive valuations."},{id:"usd-inr",category:"macro",name:"USD / INR Exchange Rate",tag:"Currency Health",tagVariant:"rose",keywords:"usdinr exchange rate dollar currency depreciation rupee hedge",summary:"Measures how many Rupees are required to buy 1 US Dollar. The INR has depreciated at ~3.2% to 3.5% annually over the last 30 years.",formula:"Real-time ticker CURRENCY:USDINR.",interpretation:"A 100% India-denominated portfolio is exposed to currency depreciation. Holding Gold and International Feeder ETFs provides an automatic dollar hedge.",actionablePlaybook:"Allocate 10%–15% of your net worth to Gold (SGBs) and US equity feeder ETFs to capture international currency alpha automatically."},{id:"india-vix",category:"macro",name:"India VIX (Volatility Index)",tag:"Fear Gauge",tagVariant:"indigo",keywords:"india vix volatility index fear gauge panic crash dip",summary:"Measures expected 30-day volatility in the Nifty 50 options market. Known globally as the stock market fear gauge.",formula:"Real-time ticker INDEXNSE:INDIAVIX.",interpretation:"VIX < 13: Complacency. VIX 13–18: Normal market range. VIX > 22: Extreme fear & panic.",actionablePlaybook:"Spikes in VIX (>20) historically mark the most profitable long-term SIP buying windows. Never stop investments when VIX is high."},{id:"nifty-200-ema",category:"macro",name:"Nifty 50 vs. 200 EMA",tag:"Trend Filter",tagVariant:"emerald",keywords:"200 ema nifty moving average trend dual momentum bull bear",summary:"The 200-day Exponential Moving Average is the institutional benchmark separating structural bull markets from bear markets.",formula:"INDEXNSE:NIFTY_50 compared against its 200-Day Exponential Moving Average.",interpretation:"CMP > 200 EMA: Structural Bull (Full 1.25x tactical multiplier). CMP < 200 EMA: Structural Bear (Defensive 0.50x caution multiplier).",actionablePlaybook:"When Nifty breaks below its 200 EMA, Net Worth Manager slows down fresh equity deployment, parking safety tranches in arbitrage/liquid funds."},{id:"hrp-weights",category:"quant",name:"ML Hierarchical Risk Parity (HRP)",tag:"Optimal Diversification",tagVariant:"indigo",keywords:"hrp hierarchical risk parity lopez de prado machine learning clustering",summary:"A machine-learning risk allocation model that groups correlated Indian assets without the dangerous matrix inversion errors of traditional Markowitz models.",formula:"Tree clustering via distance metric d = sqrt((1-rho)/2) + quasi-diagonalization + recursive bisection.",interpretation:"Unlike classical models that over-concentrate in low-volatility debt, HRP creates genuine multi-asset risk parity tailored for Indian market cycles.",actionablePlaybook:"Switch to the ML-HRP preset in the Rebalancer to see the mathematically optimal risk parity target for your asset holdings."},{id:"cvar-stress",category:"quant",name:"CVaR 95% (Expected Shortfall)",tag:"Tail Risk Stress Test",tagVariant:"rose",keywords:"cvar conditional value at risk expected shortfall tail risk black swan drawdown",summary:"Quantifies the average loss your portfolio would suffer in the worst 5% of monthly market shocks (e.g. 2008 Lehman collapse or March 2020 COVID shock).",formula:"CVaR_0.95 = Expected loss given loss exceeds VaR_0.95.",interpretation:"Nifty 50 Pure Equity: ~ -18.4% monthly worst case. Balanced User Portfolio: ~ -8.5% to -11.5%. All-Weather: ~ -5.8%.",actionablePlaybook:"Review the Rupee drawdown figure (e.g. ≈ ₹3.8L). If this exceeds your emotional tolerance, increase your allocation to Sovereign TMFs and Gold."},{id:"diversification-ratio",category:"quant",name:"Diversification Ratio (DR)",tag:"Risk Multiplier",tagVariant:"emerald",keywords:"diversification ratio dr correlation buffer choueifaty",summary:"Measures how effectively non-correlated assets (Gold, Sovereign Debt, Real Estate) cancel out the downside volatility of your stocks.",formula:"DR = Weighted Sum of Individual Volatilities ÷ Total Portfolio Volatility.",interpretation:"DR = 1.0x: Zero diversification (100% single asset). DR > 1.4x: Institutional-level risk mitigation.",actionablePlaybook:"Aim for a DR above 1.4x. Every 0.1x boost reduces emotional anxiety during market crashes without sacrificing long-term returns."},{id:"target-maturity-funds",category:"instruments",name:"Target Maturity Funds (TMFs)",tag:"FD Replacement",tagVariant:"emerald",keywords:"target maturity funds tmf bharat bond g-sec fixed deposit fd ytm",summary:"Passive index debt funds holding Central G-Secs or AAA PSU bonds that mature in a defined target year (e.g., 2028, 2030, 2032).",formula:"Yield to Maturity (YTM) locked through roll-down duration.",interpretation:"Zero credit default risk (sovereign backed)
