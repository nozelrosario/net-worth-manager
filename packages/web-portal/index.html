<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Net Worth Manager">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Net Worth Manager</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0B0F17; color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    iframe { width: 100%; height: 100%; border: none; }
    #loader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0B0F17; z-index: 100; transition: opacity 0.5s; }
    .brand-loader {
      width: 60px; height: 60px; position: relative; animation: pulse 2s infinite ease-in-out;
    }
    .brand-loader::before, .brand-loader::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      border: 4px solid #10b981; border-radius: 50%; opacity: 0;
      animation: ripple 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .brand-loader::after { animation-delay: -1s; border-color: #6366f1; }
    @keyframes ripple { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    /* UAT Bar */
    #uat-bar { display: none; height: 3px; background: #F59E0B; position: fixed; top: 0; left: 0; right: 0; z-index: 999; }
    .is-uat #uat-bar { display: block; }
    .is-uat iframe { height: calc(100% - 3px); margin-top: 3px; }

    /* Setup Error Card */
    #setup-error { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; padding: 24px; background: #0B0F17; z-index: 200; }
    .setup-card { max-width: 440px; width: 100%; background: #111827; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .setup-card h2 { margin: 0 0 8px; font-size: 18px; color: #F8FAFC; }
    .setup-card p { margin: 0 0 12px; font-size: 14px; line-height: 1.5; color: #94A3B8; }
    .setup-card code { background: #1E293B; padding: 2px 6px; border-radius: 4px; color: #10B981; font-size: 12px; }
    .setup-card a { color: #10B981; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div id="uat-bar"></div>
  <div id="loader">
    <div class="brand-loader">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;position:absolute;z-index:10;padding:12px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
    </div>
    <div style="margin-top: 24px; color: #94A3B8; font-size: 14px; font-family: 'Inter', sans-serif; letter-spacing: 0.05em; font-weight: 500;" id="load-text">INITIALIZING LEDGER</div>
  </div>

  <div id="setup-error">
    <div class="setup-card">
      <h2>Portal Configuration Required</h2>
      <p>No valid Google Apps Script deployment URL was found for this portal.</p>
      <p>Copy <code>config.example.js</code> to <code>config.js</code> (or configure your <code>APPS_SCRIPT_URL_PROD</code> / <code>APPS_SCRIPT_URL_UAT</code> GitHub secrets) with your Apps Script Web App URL.</p>
      <p><a href="https://github.com/nozelrosario/net-worth-manager-releases/blob/main/FULL-SETUP.md" target="_blank" rel="noopener noreferrer">View Setup Guide &rarr;</a></p>
    </div>
  </div>

  <iframe id="app-frame" allow="camera; microphone; fullscreen; clipboard-read; clipboard-write"></iframe>

  <script src="/config.js" onerror="window.__NWM_CONFIG_LOAD_ERR__=true"></script>
  <script>
    (function() {
      const NWM_APP_ID = 'net-worth-manager';
      const NWM_APP_VERSION = '4.2.0';
      try {
        const origin = window.location.origin || '';
        window.__NWM_IDENTITY__ = {
          app: NWM_APP_ID,
          version: NWM_APP_VERSION,
          origin: origin,
          signature: 'NWM-' + btoa(NWM_APP_ID + ':' + origin),
          isWrapper: true
        };
      } catch (e) {}

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    })();

    function isValidAppsScriptUrl(url) {
      return typeof url === 'string' &&
        /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(\?.*)?$/i.test(url.trim()) &&
        !url.includes('YOUR_PROD_DEPLOYMENT_ID') &&
        !url.includes('YOUR_UAT_DEPLOYMENT_ID');
    }

    function showSetupError() {
      const loader = document.getElementById('loader');
      if (loader) loader.style.display = 'none';
      const err = document.getElementById('setup-error');
      if (err) err.style.display = 'flex';
    }

    function init() {
      const endpoints = (window.NWM_CONFIG && typeof window.NWM_CONFIG === 'object') ? window.NWM_CONFIG : {};
      const urlParams = new URLSearchParams(window.location.search);
      const isUatPath = window.location.pathname.includes('/uat/');
      const isUatQuery = urlParams.get('env') === 'uat' || urlParams.get('env') === 'test';
      const isUAT = isUatPath || isUatQuery;

      if (isUAT) {
        document.body.classList.add('is-uat');
        document.getElementById('load-text').innerText = 'Initializing UAT Environment...';
        document.title = 'Net Worth Manager (UAT)';
      }

      const rawTarget = isUAT ? endpoints.uat : endpoints.prod;
      if (!isValidAppsScriptUrl(rawTarget)) {
        showSetupError();
        return;
      }

      const frame = document.getElementById('app-frame');
      let targetUrl = rawTarget.trim();
      if (isUAT) targetUrl += (targetUrl.includes('?') ? '&' : '?') + 'env=uat';

      frame.onload = function() {
        const loader = document.getElementById('loader');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);

        // Share portal URL with inner iframe for Mobile QR pairing
        try {
          if (frame.contentWindow) {
            const portalUrl = window.location.origin + (isUAT ? '/?env=uat' : '/');
            frame.contentWindow.postMessage(JSON.stringify({
              type: 'NWM_PORTAL_INFO',
              portalUrl: portalUrl
            }), '*');
          }
        } catch (e) {}
      };

      frame.src = targetUrl;
    }

    // Relay messages between React Native WebView and the inner Apps Script iframe
    window.addEventListener('message', function(event) {
      const frame = document.getElementById('app-frame');
      if (typeof event.data === 'string' && event.data.includes('SMS_SYNC')) {
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage(event.data, '*');
        }
        return;
      }

      // Forward identity / reset messages from inner Apps Script iframe up to React Native WebView
      if (frame && event.source === frame.contentWindow && typeof event.data === 'string') {
        if (event.data.includes('NWM_IDENTITY_VERIFIED') || event.data.includes('NWM_RESET_INSTANCE_URL')) {
          if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function') {
            window.ReactNativeWebView.postMessage(event.data);
          }
        }
      }
    });

    init();
  </script>
</body>
</html>
