<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Net Worth Manager</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f9fafb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    iframe { width: 100%; height: 100%; border: none; }
    #loader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0B0F17; z-index: 100; transition: opacity 0.5s; }
    .brand-loader {
      width: 60px; height: 60px; position: relative; animation: pulse 2s infinite ease-in-out;
    }
    .brand-loader::before, .brand-loader::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      border: 4px solid #10b981; border-radius: 50%; opacity: 0;
      animation: ripple 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .brand-loader::after { animation-delay: -1s; border-color: #6366f1; }
    @keyframes ripple { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    /* UAT Bar */
    #uat-bar { display: none; height: 3px; background: #F59E0B; position: fixed; top: 0; left: 0; right: 0; z-index: 999; }
    .is-uat #uat-bar { display: block; }
    .is-uat iframe { height: calc(100% - 3px); margin-top: 3px; }
  </style>
</head>
<body>
  <div id="uat-bar"></div>
  <div id="loader">
    <div class="brand-loader">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;position:absolute;z-index:10;padding:12px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
    </div>
    <div style="margin-top: 24px; color: #94A3B8; font-size: 14px; font-family: 'Inter', sans-serif; letter-spacing: 0.05em; font-weight: 500;" id="load-text">INITIALIZING LEDGER</div>
  </div>
  <iframe id="app-frame" allow="camera; microphone; fullscreen; clipboard-read; clipboard-write"></iframe>

  <script>
    const ENDPOINTS = {
      prod: 'https://script.google.com/macros/s/AKfycbzGmUQhKj0d6_sogDKHKfp-NYD1mFIpJgeItPG2budU6EDfC1_mrLJwrvP7xwppV5-8/exec',
      uat: 'https://script.google.com/macros/s/AKfycbxhi-fQRH5x7-5xsPEB_I1LWOFALjPkidQutcfWbw8dVhwG-PK5AKkepuZD42fJVTPghw/exec'
    };

    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const isUatPath = window.location.pathname.includes('/uat/');
      const isUatQuery = urlParams.get('env') === 'uat' || urlParams.get('env') === 'test';
      const isUAT = isUatPath || isUatQuery;

      if (isUAT) {
        document.body.classList.add('is-uat');
        document.getElementById('load-text').innerText = 'Initializing UAT Environment...';
        document.title = 'Net Worth Manager (UAT)';
      }

      const frame = document.getElementById('app-frame');
      let targetUrl = isUAT ? ENDPOINTS.uat : ENDPOINTS.prod;
      if (isUAT) targetUrl += (targetUrl.includes('?') ? '&' : '?') + 'env=uat';

      frame.onload = function() {
        const loader = document.getElementById('loader');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);
      };

      frame.src = targetUrl;
    }

    init();
  </script>
</body>
</html>
