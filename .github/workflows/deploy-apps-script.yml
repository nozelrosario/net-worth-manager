name: Deploy Backend to Google Apps Script

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'packages/apps-script/**'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/apps-script

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Guard Production Deployment
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::❌ Production deployments are strictly restricted to the 'main' branch!"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Build UI
        run: |
          cd ui
          npm install
          npm run build

      - name: Restore Clasp Credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Deploy to UAT
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'uat')
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID_UAT }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID_UAT }}
        run: |
          echo '{"scriptId":"'"$SCRIPT_ID"'","rootDir":"."}' > .clasp.json
          clasp push --force
          clasp deploy -i "$DEPLOYMENT_ID" -d "UAT Deploy (${{ github.ref_name }}): $GITHUB_SHA"

      - name: Deploy to Production
        if: |
          github.ref == 'refs/heads/main' && (
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'production')
          )
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          echo '{"scriptId":"'"$SCRIPT_ID"'","rootDir":"."}' > .clasp.json
          clasp push --force
          clasp deploy -i "$DEPLOYMENT_ID" -d "PROD Release (${{ github.ref_name }}): $GITHUB_SHA"
