name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.FIREBASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Firebase Config & Portal Endpoints
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SITE_PROD: ${{ secrets.FIREBASE_SITE_PROD }}
          FIREBASE_SITE_UAT: ${{ secrets.FIREBASE_SITE_UAT }}
          APPS_SCRIPT_URL_PROD: ${{ secrets.APPS_SCRIPT_URL_PROD }}
          APPS_SCRIPT_URL_UAT: ${{ secrets.APPS_SCRIPT_URL_UAT }}
        run: |
          SITE_PROD="${FIREBASE_SITE_PROD:-$FIREBASE_PROJECT_ID}"
          SITE_UAT="${FIREBASE_SITE_UAT:-${FIREBASE_PROJECT_ID}-uat}"
          cat > packages/web-portal/.firebaserc <<EOF
          {
            "projects": { "default": "$FIREBASE_PROJECT_ID" },
            "targets": {
              "$FIREBASE_PROJECT_ID": {
                "hosting": {
                  "prod": ["$SITE_PROD"],
                  "uat": ["$SITE_UAT"]
                }
              }
            }
          }
          EOF
          cat > packages/web-portal/config.js <<EOF
          window.NWM_CONFIG = {
            prod: "${APPS_SCRIPT_URL_PROD:-}",
            uat: "${APPS_SCRIPT_URL_UAT:-}"
          };
          EOF
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          entryPoint: packages/web-portal
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NET_WORTH_MANAGER_AFF0B }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          target: uat
